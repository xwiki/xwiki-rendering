rendering.macro.error.unknown=Ukendt makro: {0}.
rendering.macro.error.unknown.description=Makroen [{0}] findes ikke på listen over registrerede makroer. Kontroller stavemåden, eller kontakt din administrator.
rendering.macro.error.failed=Makroen [{0}] kunne ikke udføres.
rendering.macro.error.invalid=Ugyldig makro: {0}.
rendering.macro.error.standalone=Makroen [{0}] er en selvstændig makro og kan ikke bruges i teksten.
rendering.macro.error.standalone.description=Makroen genererer selvstændigt indhold. Derfor skal du bruge en syntaks, der adskiller makroen fra indholdet før og efter den, så den står på sin egen linje. I XWiki-syntaks 2.0+ betyder det fx, at makroen skal være adskilt fra indholdet før og efter den af 2 linjeskift.
rendering.macro.error.invalidParameter=Ugyldige makroparametre for makroen [{0}].
